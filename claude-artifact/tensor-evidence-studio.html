:root {
  color-scheme: dark;

  --soft: rgba(255,255,255,.06); --ink: #f2f3f6; --muted: #a3a8b5; --faint: #7a808e; --accent: #ff4d43; --accent-soft: rgba(255,77,67,.16);

  --s1: #3987e5; --s2: #d95926; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #5d6270; --na: #3a3e48;

}

  color-scheme: light; --bg: #eef1f7; --bg2: #f8f9fc; --glass: rgba(255,255,255,.62); --glass2: rgba(255,255,255,.85); --line: rgba(20,24,40,.10);
  --soft: rgba(20,24,40,.05); --ink: #12141a; --muted: #555b68; --faint: #7d8391; --accent: #d92d20; --accent-soft: rgba(217,45,32,.1);
  --ok: #0b7a3b; --ok-soft: rgba(12,163,12,.12); --warn: #a15c00; --warn-soft: rgba(250,178,25,.18); --info: #1c5cab; --info-soft: rgba(42,120,214,.12);
  --s1: #2a78d6; --s2: #eb6834; --neutral: #9aa0ab; --na: #d5d8de; --grid: rgba(20,24,40,.08); --solid: #f7f8fb;
  --blobA: rgba(255,77,67,.15); --blobB: rgba(57,135,229,.2); --blobC: rgba(98,80,214,.13); --shadow: 0 10px 34px rgba(30,40,80,.1), inset 0 1px 0 rgba(255,255,255,.7);
} }

  color-scheme: light; --bg: #eef1f7; --bg2: #f8f9fc; --glass: rgba(255,255,255,.62); --glass2: rgba(255,255,255,.85); --line: rgba(20,24,40,.10);
  --soft: rgba(20,24,40,.05); --ink: #12141a; --muted: #555b68; --faint: #7d8391; --accent: #d92d20; --accent-soft: rgba(217,45,32,.1);
  --ok: #0b7a3b; --ok-soft: rgba(12,163,12,.12); --warn: #a15c00; --warn-soft: rgba(250,178,25,.18); --info: #1c5cab; --info-soft: rgba(42,120,214,.12);
  --s1: #2a78d6; --s2: #eb6834; --neutral: #9aa0ab; --na: #d5d8de; --grid: rgba(20,24,40,.08); --solid: #f7f8fb;
  --blobA: rgba(255,77,67,.15); --blobB: rgba(57,135,229,.2); --blobC: rgba(98,80,214,.13); --shadow: 0 10px 34px rgba(30,40,80,.1), inset 0 1px 0 rgba(255,255,255,.7);
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg2); }
body { margin: 0; color: var(--ink); font: 14px/1.5 var(--f-ui); min-height: 100vh;
  background: radial-gradient(900px 600px at 6% -10%, var(--blobA), transparent 60%), radial-gradient(800px 700px at 100% 8%, var(--blobB), transparent 60%),
    radial-gradient(700px 600px at 40% 115%, var(--blobC), transparent 60%), linear-gradient(160deg, var(--bg), var(--bg2)); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.glass, .card { background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; border-radius: 18px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.3px; display: flex; align-items: center; gap: 8px; font-size: 16px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.top .eng { color: var(--muted); font-size: 13px; min-width: 0; }
.top .sp { flex: 1; }
.tabs { display: flex; gap: 4px; margin: 14px 0; padding: 4px; border-radius: 14px; overflow-x: auto; width: fit-content; max-width: 100%; }
.tabs button { background: none; border: 0; padding: 7px 13px; border-radius: 10px; color: var(--muted); white-space: nowrap; }
.tabs button.on { background: var(--glass2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 550; }
.card { border-radius: 16px; padding: 16px 18px; min-width: 0; }
h1 { font-size: 22px; letter-spacing: -.4px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 13.5px; margin: 0 0 6px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .mono { font-family: var(--f-mono); font-size: 12px; }
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); } .s2 { grid-column: span 2; }
.lead { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-size: 26px; font-weight: 650; letter-spacing: -.6px; font-variant-numeric: tabular-nums; } .stat .n { color: var(--faint); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--glass2); border-radius: 10px; padding: 6px 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); } .btn.ok { background: #0b8a3e; border-color: #0b8a3e; color: #fff; }
.btn.bad { color: var(--accent); } .btn.sm { padding: 3px 10px; font-size: 12.5px; border-radius: 8px; }
input, select, textarea { border: 1px solid var(--line); background: var(--glass2); border-radius: 10px; padding: 7px 10px; width: 100%; min-width: 0; }
select option { background: var(--solid); color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
label.f { display: block; } label.f span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--soft); vertical-align: top; font-variant-numeric: tabular-nums; }
tr.click:hover td { background: var(--soft); cursor: pointer; }
.pill { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; padding: 1px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; font-weight: 500; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--accent-soft); color: var(--accent); } .pill.info { background: var(--info-soft); color: var(--info); }
.dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
.bar { height: 9px; border-radius: 99px; background: var(--soft); overflow: hidden; } .bar > div { height: 100%; border-radius: 99px; background: var(--s1); }
.note { background: var(--info-soft); color: var(--info); padding: 8px 12px; border-radius: 10px; font-size: 13px; }
.warnbox { background: var(--warn-soft); color: var(--warn); padding: 7px 11px; border-radius: 10px; font-size: 12.5px; margin: 0 0 6px; }
.err { background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 13px; }
.drop { border: 1.5px dashed var(--line); border-radius: 16px; padding: 24px; text-align: center; background: var(--soft); transition: .15s; }
.drop.over { border-color: var(--s1); background: var(--info-soft); }
.pipe { display: flex; gap: 4px; } .pipe span { height: 6px; flex: 1; min-width: 14px; border-radius: 99px; background: var(--soft); }
.pipe .d { background: var(--good); } .pipe .a { background: var(--s1); animation: pulse 1s infinite alternate; } .pipe .x { background: var(--critical); }
@keyframes pulse { from { opacity: .4 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .pipe .a { animation: none; } }
.chunk { border-left: 3px solid var(--line); padding: 6px 10px; margin-bottom: 8px; white-space: pre-wrap; font-size: 12.5px; background: var(--soft); border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
.chunk.cited { border-color: var(--accent); background: var(--accent-soft); }
mark { background: rgba(255,140,100,.38); color: inherit; border-radius: 3px; padding: 0 1px; }
.chart text { fill: var(--muted); font: 11px var(--f-ui); }
.gl { stroke: var(--grid); stroke-width: 1; fill: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hero { font-size: 46px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
.matrix { display: flex; flex-wrap: wrap; gap: 4px; } .matrix div { width: 20px; height: 20px; border-radius: 5px; }
.matrix div:hover { outline: 2px solid var(--ink); }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--solid); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 320px; }
.timeline { position: relative; padding-left: 18px; } .timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.ev { position: relative; margin-bottom: 9px; } .ev::before { content: ""; position: absolute; left: -17px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--neutral); border: 2px solid var(--solid); }
.ev.done::before { background: var(--good); } .ev.late::before { background: var(--critical); }
.drawer { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end; background: rgba(0,0,0,.35); }
.drawer .panel { width: min(1100px, 100%); height: 100%; overflow-y: auto; background: var(--solid); border-left: 1px solid var(--line); padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px 18px; }
.answer { white-space: pre-wrap; background: var(--soft); border-radius: 12px; padding: 12px 14px; min-height: 60px; overflow-wrap: anywhere; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--solid); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow); max-width: min(420px, calc(100vw - 32px)); }
@media (max-width: 960px) { .g2, .g3, .g4, .lead { grid-template-columns: minmax(0,1fr); } .s2 { grid-column: auto; } }
</style>

<div class="wrap">
  <header class="top glass">
    <div class="brand"><i></i>Tensor Evidence Studio</div>

async function deleteEv(id) { delete S.ev[id]; if (db) { try { await db.doc("evidence/" + id).delete(); } catch {} } S.drawer = null; render(); }

function approvedCodes() {

  } else { comp.expert_signoff = pct(sc.filter(r => r.signed).length, n) || 0;

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-ev],[data-kind],[data-q],[data-ms],[data-sign],[data-na],[data-close]"); if (!t) return;

  if (t.dataset.kind) { S.importKind = t.dataset.kind; S.importLog = null; S.importFile = null; return render(); }
  if (t.dataset.q) { S.askDraft = t.dataset.q; render(); return document.querySelector('[data-act="ask"]')?.click(); }
  if (t.dataset.ms) { e.preventDefault(); const m = S.eng.milestones.find(x => x.id === t.dataset.ms); m.done = m.done ? null : today(); return saveEng(); }
  if (t.dataset.sign) { const o = S.eng.controls[t.dataset.sign] ||= {}; const ev = Object.values(S.ev).filter(x => x.status === "approved" && x.review.controls.includes(t.dataset.sign)).map(x => x.sha256).sort();
    o.signed = { by: S.uid, at: new Date().toISOString(), sha: await sha256(new TextEncoder().encode(JSON.stringify([t.dataset.sign, ev]))) }; toast("Signed off; content hash recorded."); return saveEng(); }
  if (t.dataset.na) { const o = S.eng.controls[t.dataset.na] ||= {}; o.na = !o.na; return saveEng(); }
  if (t.dataset.close) { S.closing = t.dataset.close; const b = document.getElementById("closeBox"); b.hidden = false; document.getElementById("closeCode").textContent = S.eng.exceptions.find(x => x.id === S.closing).code; return; }
  const ev = S.drawer && S.ev[S.drawer];
  switch (t.dataset.act) {
    case "browse": return document.getElementById("fileInput").click();
    case "demo": S.view = "evidence"; render(); return loadDemo();
    case "demopack": return downloadDemoPack();
    case "close": S.drawer = null; return render();
    case "approve": { const keep = [...document.querySelectorAll("[data-keep]")].filter(x => x.checked).map(x => x.dataset.keep);
      if (!keep.length) return toast("Select at least one mapping, or reject.");
      const edited = keep.length !== ev.analysis.candidate_controls.length;
      ev.review = { decision: edited ? "approved with edits" : "approved", controls: keep, by: S.uid, at: new Date().toISOString(), comment: document.getElementById("revComment").value.trim() };
      ev.status = "approved"; S.drawer = null; toast("Approved: evidence linked to " + keep.join(", ")); return saveEv(ev); }

    case "rerun": return analyze(ev);
    case "delete": return deleteEv(ev.id);
    case "addtest": { const s = parseInt(document.getElementById("ts").value, 10), d = parseInt(document.getElementById("tv").value, 10);
      if (isNaN(s) || isNaN(d) || d < 0 || d > s) return toast("Deviations must be between 0 and the number of samples.");
      recordTest({ code: document.getElementById("tc").value, date: document.getElementById("td").value || today(), samples: s, dev: d, result: d === 0 ? "pass" : d / s <= .1 ? "pass_with_exception" : "fail", proc: document.getElementById("tp").value.trim() });
      toast(d ? "Test recorded and exception raised." : "Test recorded."); return saveEng(); }
    case "doclose": { const n = document.getElementById("closeNote").value.trim(); if (n.length < 5) return toast("Add a closure note (retest result)."); const x = S.eng.exceptions.find(y => y.id === S.closing); x.status = "closed"; x.closed = today(); x.note = n; S.closing = null; return saveEng(); }
    case "cancelclose": document.getElementById("closeBox").hidden = true; return;
    case "pickSheet": return document.getElementById("sheetInput").click();
    case "sampleSheet": return validateSheet(new File([S.importKind === "tests" ? DEMO_TESTS : DEMO_GAP], S.importKind === "tests" ? "ACME_SOC2_Type2_Test_Log.csv" : "ACME_SOC2_Gap_Assessment.csv", { type: "text/csv" }));
    case "applyImport": return applyImport(S.importKind || "assessment");
    case "saveSetup": { const fws = [...document.querySelectorAll("[data-fw]")].filter(x => x.checked).map(x => x.dataset.fw); if (!fws.length) return toast("Choose at least one framework.");
      Object.assign(S.eng, { company: document.getElementById("sCompany").value.trim() || "Your company", signer: document.getElementById("sSigner").value.trim(), target: document.getElementById("sTarget").value || S.eng.target, frameworks: fws });
      toast("Engagement saved."); return saveEng(); }
    case "csv": { const a = analytics(); const lines = [["Control", "Title", "Domain", "Framework refs", "Effectiveness", "Owner", "Risk", "Self-assessment", "Approved evidence", "Signed off", "Last test"].join(",")];
      a.rows.forEach(r => lines.push([r.code, r.title, r.domain, r.refs.join("; "), ST[r.status][0], r.owner, r.risk, r.self || "", r.evidence, r.signed ? "yes" : "", r.test ? `${r.test.date} ${r.test.result} (${r.test.dev}/${r.test.samples})` : ""].map(csvCell).join(",")));
      return save("controls.csv", lines.join("\n")); }
    case "dlreport": { const html = `<!doctype html><html><head><meta charset="utf-8"><title>Readiness report — ${esc(S.eng.company)}</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#16181d}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;font-size:13px}.pill{font-size:12px}</style></head><body>${document.getElementById("view").innerHTML.replace(/<button[^>]*>.*?<\/button>/g, "")}</body></html>`;
      return save("readiness-report.html", html); }
    case "ask": return ask();
    case "stopask": S.askCtl?.abort(); return;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "fileInput" && t.files.length) { ingest([...t.files]); t.value = ""; }
  if (t.id === "sheetInput" && t.files[0]) { validateSheet(t.files[0]); t.value = ""; }
  if (t.dataset.owner) { (S.eng.controls[t.dataset.owner] ||= {}).owner = t.value.trim(); saveEng(); }
  if (t.dataset.risk) { (S.eng.controls[t.dataset.risk] ||= {}).risk = t.value; saveEng(); }
  if (["fg", "fd", "fs"].includes(t.id)) { S.filters[{ fg: "g", fd: "d", fs: "st" }[t.id]] = t.value; render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "fq") { S.filters.q = e.target.value; render(); } if (e.target.id === "askBox") S.askDraft = e.target.value; });
document.getElementById("drawer").addEventListener("click", e => { if (e.target.id === "drawer") { S.drawer = null; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.drawer) { S.drawer = null; render(); } });
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { tip.hidden = true; return; } tip.innerHTML = el.getAttribute("data-tip"); tip.hidden = false;
  const x = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12), y = e.clientY - tip.offsetHeight - 12; tip.style.left = x + "px"; tip.style.top = (y < 4 ? e.clientY + 16 : y) + "px"; });

async function ask() {
  const qtext = (document.getElementById("askBox").value || "").trim(); if (!qtext || !sample) return;
  const a = analytics();
  const ctx = { company: S.eng.company, frameworks: S.eng.frameworks, readiness: { score: a.score, rating: a.rating, components: a.W.map(([k, l]) => [l, a.comp[k]]) },
    controls: a.rows.map(r => ({ code: r.code, title: r.title, status: ST[r.status][0], owner: r.owner, risk: r.risk, self: r.self, evidence: r.evidence, test: r.test ? r.test.result : null })),
    open_exceptions: a.openExc.map(x => ({ code: x.code, control: x.ctl, severity: x.sev, target: x.target, desc: x.desc })),
    evidence: Object.values(S.ev).map(v => ({ name: v.name, status: v.status, controls: v.review?.controls || v.analysis?.candidate_controls?.map(c => c.control_code) || [] })),
    milestones: S.eng.milestones.map(m => ({ title: m.title, date: m.date, done: !!m.done })), today: today() };
  const prompt = `You are a senior compliance consultant at TensorInfoSec helping deliver SOC 2 / ISO 27001 readiness. Answer the question using ONLY the engagement data below (JSON). Be specific, cite control codes, and keep it practical. Never claim the company is compliant or certified; an independent auditor decides that. Use short paragraphs or a short list.\n\nENGAGEMENT DATA:\n${JSON.stringify(ctx).slice(0, 50000)}\n\nQUESTION: ${qtext}`;
  S.askCtl = new AbortController(); S.askText = "Thinking…"; render();
  try { await sample(prompt, { cache: false, signal: S.askCtl.signal, onText: ({ text }) => { S.askText = text; const el = document.getElementById("answer"); if (el) el.textContent = text; } }); }
  catch (e) { S.askText = (e.text || "") + (e.code && e.code !== "cancelled" ? `\n\n[${e.code === "rate_limited" ? "Claude is busy or your usage limit was reached; try again later." : e.code === "not_granted" ? "Asking Claude was not allowed in this view." : "Claude could not answer: " + e.code}]` : ""); if (e.code === "not_granted") { sample = null; setAi(); } }
  S.askCtl = null; render();
}

/* ============================== theme & boot ============================== */
function setAi() { const el = document.getElementById("aiState"); el.textContent = sample ? "AI: Claude" : "AI: offline keyword drafts"; el.className = "pill " + (sample ? "ok" : "warn"); }
document.getElementById("themeBtn").onclick = () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"), n = cur === "dark" ? "light" : "dark"; r.dataset.theme = n; try { localStorage.setItem("tes-theme", n); } catch {} };
try { const t = localStorage.getItem("tes-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
{ const h = (location.hash || "").slice(1); if (TABS.some(([k]) => k === h)) S.view = h; }
S.eng = blankEng(); render();

(async function boot() {
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  [db, sample, downloads, userCap] = await Promise.all([use("db"), use("sample"), use("downloads"), use("user")]);
  setAi();
  if (userCap) { try { S.uid = await userCap.id(); S.canEdit = true; } catch {} }
  if (db) {
    db.doc("engagement/main").onSnapshot(snap => { if (snap.exists) { S.eng = Object.assign(blankEng(), snap.data()); S.eng = JSON.parse(JSON.stringify(S.eng)); } render(); }, () => {});
    db.collection("evidence").onSnapshot(async q => { const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); });
      for (const [k, v] of Object.entries(S.ev)) if (!m[k] && ["scanning", "extracting", "analyzing"].includes(v.status)) m[k] = v;
      S.ev = JSON.parse(JSON.stringify(m)); await resolveNames(); render(); }, () => {});
  } else { document.getElementById("engLabel").textContent += " · local session (not saved)"; render(); }
})();
async function resolveNames() {
  if (!userCap || !userCap.profiles) return; const ids = [...new Set(Object.values(S.ev).map(v => v.review?.by).filter(Boolean))].filter(i => !(i in names)); if (!ids.length) return;
  try { const ps = await userCap.profiles(ids); for (const i of ids) names[i] = (ps[i] && ps[i].name) || ""; } catch {}
}
</script>
